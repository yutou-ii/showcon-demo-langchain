[project]
name = "showcon-demo-langchain"
version = "0.1.0"
description = "第一阶段本地对话智能体的 Python 后端服务"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-langgraph==0.0.42",
    "fastapi==0.141.1",
    "langchain==1.3.14",
    "langchain-openai==1.4.1",
    "langgraph==1.2.10",
    "pydantic-settings>=2.0,<3.0",
    "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.25,<2.0",
]
